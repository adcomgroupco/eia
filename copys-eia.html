<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIA — Revisión Copys 2027-1 · Adcom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/adcom-tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#1A1A1A;--yellow:#ffd400;--bg:#F5F5F5;--white:#fff;
  --t2:var(--fg-secondary);--t3:var(--fg-muted);--border:#E0E0E0;
  --navy:#163073;--dark:#2B2B2B;
  --lime:#D4F53C;--lime-ink:#3d4a00;
  --meta:#1877F2;--meta-bg:#EBF3FD;--meta-brd:#C2D9F8;
  --pz-bg:#F3F7E3;--pz-brd:#D9E8A6;
  --ok:#2E7D32;--ok-bg:#E8F5E9;--ok-brd:#A5D6A7;
  --no:#C62828;--no-bg:#FFEBEE;--no-brd:#EF9A9A
}
body{font-family:'Poppins',sans-serif;background:var(--bg);min-height:100vh;color:var(--black)}

/* HEADER */
.hdr{background:var(--black);height:62px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.hdr-l{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#ffd400}
.hdr-title{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title span{color:#ffd400}
.hdr-r{display:flex;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--radius);white-space:nowrap}
.pill-y{background:rgba(255,212,0,.15);border:1px solid rgba(255,212,0,.35);color:#ffd400}
.pill-w{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)}

/* FILTER BAR */
.fbar{background:#fff;padding:11px 32px;display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--yellow);position:sticky;top:62px;z-index:200;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.fgrp{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.flbl{font-size:12px;font-weight:700;color:var(--t3);white-space:nowrap}
.fb{padding:5px 12px;border-radius:var(--radius);border:1.5px solid var(--border);background:transparent;color:var(--t3);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;font-family:'Poppins',sans-serif;white-space:nowrap}
.fb:hover{border-color:#aaa;color:var(--t2)}
.fb.on{background:var(--black);color:#fff;border-color:var(--black)}
.fb.on-pre{background:var(--dark);color:#fff;border-color:var(--dark)}
.fb.on-pos{background:var(--navy);color:#fff;border-color:var(--navy)}
.fb.on-pz{background:var(--lime);color:var(--black);border-color:#b6d42a}
.fb.on-meta{background:var(--meta);color:#fff;border-color:var(--meta)}
.fb.on-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-brd)}
.fb.on-no{background:var(--no-bg);color:var(--no);border-color:var(--no-brd)}
.fb.on-pe{background:#FFF9C4;color:#856404;border-color:#F0D060}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.prog-out{width:110px;height:5px;background:#eee;overflow:hidden}
.prog-in{height:100%;background:var(--yellow);transition:width .35s}
.prog-txt{font-size:12px;color:var(--t3);font-weight:600;white-space:nowrap}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:22px 20px 80px;display:flex;flex-direction:column;gap:14px}
/* GUÍA */
.guia{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.guia>summary{list-style:none;cursor:pointer;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--yellow)}
.guia>summary::-webkit-details-marker{display:none}
.guia>summary h2{font-size:15px;font-weight:700}
.guia>summary span{font-size:12px;font-weight:600;color:var(--t3)}
.guia[open]>summary span .c{display:none}.guia:not([open])>summary span .o{display:none}
.g-body{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;padding:22px 20px}
.n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--black);font-size:12px;font-weight:700;flex-shrink:0;box-shadow:0 0 0 2px #fff}
.post{border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;overflow:hidden;font-size:12.5px}
.post-h{display:flex;align-items:center;gap:9px;padding:10px 12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--black);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.post-h b{font-size:12.5px;display:block}.post-h small{font-size:11px;color:var(--t3)}
.post-out{padding:0 34px 10px 12px;color:var(--t2);line-height:1.5;position:relative}
.post-out .n{position:absolute;right:8px;top:-4px}
.kv{position:relative;aspect-ratio:1/1;background:#222 center/cover no-repeat}
.kv .n{position:absolute;left:6px}
.post-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#F0F2F5}
.post-f small{font-size:10.5px;color:var(--t3);display:block}.post-f b{font-size:12px}
.post-f .btn{background:#E4E6EB;font-size:12px;font-weight:600;padding:7px 12px;border-radius:6px;white-space:nowrap}
.leg{display:flex;flex-direction:column;gap:12px}
.leg h3{font-size:13px;font-weight:700;margin-bottom:2px}
.li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--t2);line-height:1.55}
.li b{color:var(--black)}
.mk-w{background:var(--dark);color:#fff;font-weight:700;padding:0 5px}
.mk-g{background:var(--lime);color:var(--black);font-style:italic;padding:0 5px}
.mk-s{background:var(--dark);color:#B0B0B0;font-size:11px;letter-spacing:.04em;padding:1px 5px}
.otros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.otros>div{border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--t2)}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pasos div{background:var(--bg);border-radius:var(--radius-sm);padding:10px;font-size:12px;line-height:1.45;color:var(--t2)}
.pasos div b{display:block;font-size:18px;color:var(--black);line-height:1.1;margin-bottom:3px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;color:var(--t3)}
.spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:#7d6800;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:50px 20px;text-align:center;color:var(--t3);font-size:13px}

/* CARD */
.card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch{padding:13px 20px;display:flex;align-items:center;gap:11px;color:#fff;cursor:pointer;user-select:none}
.ch-pre{background:var(--dark)}.ch-pos{background:var(--navy)}
.lvl-badge{font-size:11px;font-weight:700;padding:3px 8px;background:var(--lime);color:var(--black);white-space:nowrap}
.ch-pos .lvl-badge{background:rgba(255,255,255,.16);color:#fff}
.prog-n{font-size:14px;font-weight:700}
.ch-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.mini{display:flex;gap:3px}
.mini i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);display:block}
.mini i.a{background:#7CD992}.mini i.r{background:#FF8A80}
.chev{font-size:14px;transition:transform .15s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .cbody{display:none}

/* SECTIONS */
.msec{border-top:1px solid var(--bg);padding:15px 20px}
.mhdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.mhdr-l{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-pz{background:#9cbf10}.dot-meta{background:var(--meta)}
.mnm{font-size:12px;font-weight:700;color:var(--t3);white-space:nowrap}
.sbdg{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius);white-space:nowrap}
.sbdg-p{background:#FFF9C4;color:#856404;border:1px solid #F0D060}
.sbdg-a{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-brd)}
.sbdg-r{background:var(--no-bg);color:var(--no);border:1px solid var(--no-brd)}

/* PIEZA */
.pz-g{display:grid;grid-template-columns:2fr 3fr;gap:10px}
.pz-prev{background:linear-gradient(160deg,#4a4a4a 0%,#2B2B2B 55%,#1c1c1c 100%);border-radius:var(--radius-sm);padding:18px 16px 14px;color:#fff;display:flex;flex-direction:column;gap:8px;min-height:190px;justify-content:flex-end;position:relative}
.pz-prev .eia{position:absolute;top:12px;right:14px;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.9}
.pz-prev .q{font-size:19px;font-weight:700;line-height:1.18}
.pz-prev .h{align-self:flex-start;background:var(--lime);color:var(--black);font-style:italic;font-size:12.5px;line-height:1.35;padding:2px 6px}
.pz-prev .s{font-size:10px;letter-spacing:.06em;color:#B0B0B0;margin-top:2px}
.pz-parts{display:flex;flex-direction:column;gap:8px}
.cbox{border-radius:var(--radius-sm);padding:10px 13px}
.bpz{background:var(--pz-bg);border:1px solid var(--pz-brd)}
.bm{background:var(--meta-bg);border:1px solid var(--meta-brd)}
.ctag{font-size:12px;font-weight:700;color:var(--t3);display:block;margin-bottom:4px}
.ctxt{font-size:13px;color:var(--black);line-height:1.55}
.cchars{font-size:12px;color:var(--t3);text-align:right;margin-top:4px}

/* REVIEW PANEL */
.rpanel{margin-top:13px;background:var(--bg);border-radius:var(--radius-sm);padding:12px 13px;border:1px solid var(--border)}
.rptitle{font-size:12px;font-weight:700;color:var(--t3);margin-bottom:9px}
.rrow{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.rbtns{display:flex;gap:7px;flex-shrink:0}
.rbtn{padding:7px 15px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;font-family:'Poppins',sans-serif}
.rbtn-a:hover,.rbtn-a.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rbtn-r:hover,.rbtn-r.on{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.cinput{flex:1;min-width:160px;padding:7px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-family:'Poppins',sans-serif;font-size:12px;color:var(--t2);background:#fff;resize:vertical;min-height:36px;line-height:1.4}
.cinput:focus{outline:none;border-color:#7d6800}
.sbtn{padding:7px 16px;background:var(--black);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sbtn:hover{background:#333}
.sbtn:disabled{background:#ccc;cursor:not-allowed}
.sok{color:var(--ok);font-size:12px;font-weight:600;align-self:center}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:999}
.mbox{background:#fff;border-radius:var(--radius);padding:36px 40px 0;max-width:420px;width:92%;text-align:center}
.mlogo{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;display:block;background:var(--yellow)}
.mtitle{font-size:19px;font-weight:700;margin-bottom:5px}
.msub{font-size:12.5px;color:var(--t3);margin-bottom:22px;line-height:1.55}
.minput{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-family:'Poppins',sans-serif;font-size:13px;color:var(--t2);margin-bottom:14px}
.minput:focus{outline:none;border-color:#7d6800}
.mbtn{width:100%;padding:11px;background:var(--black);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.ybar{height:4px;background:var(--yellow);margin:20px -40px 0;border-radius:0 0 var(--radius) var(--radius)}

@media(max-width:760px){
  .pz-g,.g-body,.otros{grid-template-columns:1fr}
  .pasos{grid-template-columns:1fr 1fr}
  .g-body{padding:16px 14px}
  .fbar{padding:10px 14px;gap:10px;position:static}
  .hdr{padding:0 14px}
  .hdr-r .pill-w{display:none}
  .main{padding:14px 12px 60px}
  .prog-wrap{display:none}
  .sep{display:none}
  .ch{padding:12px 14px;flex-wrap:wrap}
  .msec{padding:14px}
  .mhdr{flex-wrap:wrap;align-items:flex-start}
  .hdr-title{font-size:13px}
  .pill-y{display:none}
  .cinput{flex-basis:100%}
}

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const SURL = 'PEGAR_AQUI_URL_DEL_APPS_SCRIPT';
const SHEET_NAME = 'Copys';
const OUT_MAX = 150;
// Bloques de revisión: clave interna → nombre que recibe el Apps Script
const BLOQ = [
  {k:'pz', medio:'Pieza',    tipo:'pz',   tag:'Pieza · texto dentro de la imagen'},
  {k:'co', medio:'Copy out', tipo:'meta', tag:'Copy out · texto del anuncio en Meta'}
];

let DATA = [], ST = {}, OPEN = {};
let F = {modalidad:'all', medio:'all', estado:'all'};
let reviewer = '';

function go() {
  const v = document.getElementById('cni').value.trim();
  if (!v) { document.getElementById('cni').style.borderColor = '#EA4335'; return }
  reviewer = v;
  document.getElementById('clabel').textContent = v;
  document.getElementById('modal').style.display = 'none'
}

function st(v) { v = String(v||'').toLowerCase(); return v.startsWith('aprob') ? 'aprobado' : v.startsWith('rechaz') ? 'rechazado' : 'pendiente' }

// Busca la columna por el inicio del encabezado (p. ej. "COPY OUT" sirve para "COPY OUT (máx 150)")
function col(r, pre) { const k = Object.keys(r).find(h => h.toUpperCase().startsWith(pre)); return k ? r[k] : '' }

async function loadData() {
  try {
    const ctl = new AbortController();
    const tmo = setTimeout(() => ctl.abort(), 30000);
    const res = await fetch(SURL + '?action=getCopys&sheet=' + encodeURIComponent(SHEET_NAME), { signal: ctl.signal });
    clearTimeout(tmo);
    const json = await res.json();
    if (json.status !== 'ok' || !json.data || !json.data.length) { showError('No se encontraron datos en la pestaña de copys.'); return }

    DATA = json.data.map(r => ({
      programa: r['Programa']||'', modalidad: r['Modalidad']||'',
      q: col(r, 'PIEZA - PREGUNTA'), h: col(r, 'PIEZA - RESALTADO'), s: col(r, 'PIEZA - PROGRAMA'),
      out: col(r, 'COPY OUT'),
      est: BLOQ.map(b => st(r['Estado '+b.medio]))
    }));
    DATA.forEach((p, i) => {
      ST[i] = {};
      BLOQ.forEach((b, j) => ST[i][b.k] = { e: p.est[j], c: '', sent: false, saved: p.est[j] !== 'pendiente' })
    });
    build()
  } catch (err) {
    showError(err.name === 'AbortError' ? 'La carga tardó demasiado. Intenta de nuevo.' : 'Error de conexión al cargar datos: ' + err.message)
  }
}

function showError(msg) {
  document.getElementById('main').innerHTML = '<div class="empty"><p>' + esc(msg) + '</p><button class="sbtn" style="margin-top:16px" onclick="loadData()">Reintentar</button></div>';
  document.getElementById('counter').textContent = 'Error'
}

function blockHTML(p, i, b) {
  const s = ST[i][b.k];
  let cnt = '';
  if (b.tipo === 'pz') {
    cnt = `<div class="pz-g">
      <div class="pz-prev" aria-label="Vista previa de la pieza"><span class="eia">UNIVERSIDAD EIA</span>
        <div class="q">${esc(p.q)}</div><span class="h">${esc(p.h)}</span><div class="s">${esc(p.s)}</div></div>
      <div class="pz-parts">
        <div class="cbox bpz"><span class="ctag">Pregunta · texto blanco grande</span><p class="ctxt"><b>${esc(p.q)}</b></p><div class="cchars">${p.q.length} caracteres</div></div>
        <div class="cbox bpz"><span class="ctag">Resaltado · franja verde</span><p class="ctxt"><i>${esc(p.h)}</i></p><div class="cchars">${p.h.length} caracteres</div></div>
        <div class="cbox bpz"><span class="ctag">Programa · línea gris</span><p class="ctxt">${esc(p.s)}</p></div>
      </div>
    </div>`;
  } else {
    const n = p.out.length, ok = n <= OUT_MAX ? '✅' : '⚠️';
    cnt = `<div class="cbox bm"><span class="ctag">Copy out · va encima de la imagen en la publicación</span><p class="ctxt">${esc(p.out)}</p><div class="cchars">${n} / ${OUT_MAX} caracteres ${ok}</div></div>`;
  }
  const bc = s.e === 'aprobado' ? 'sbdg-a' : s.e === 'rechazado' ? 'sbdg-r' : 'sbdg-p';
  const bl = s.e === 'aprobado' ? '✓ Aprobado' : s.e === 'rechazado' ? '✕ Rechazado' : '● Pendiente';
  return `<div class="msec">
    <div class="mhdr"><div class="mhdr-l"><div class="dot dot-${b.tipo}"></div><span class="mnm">${b.tag}</span></div>
      <span class="sbdg ${bc}" id="bdg-${i}-${b.k}">${bl}</span></div>
    ${cnt}
    <div class="rpanel"><div class="rptitle">Tu revisión</div>
      <div class="rrow">
        <div class="rbtns">
          <button class="rbtn rbtn-a${s.e==='aprobado'?' on':''}" id="ba-${i}-${b.k}" onclick="setE(${i},'${b.k}','aprobado')">✓ Aprobar</button>
          <button class="rbtn rbtn-r${s.e==='rechazado'?' on':''}" id="br-${i}-${b.k}" onclick="setE(${i},'${b.k}','rechazado')">✕ Rechazar</button>
        </div>
        <textarea class="cinput" id="ci-${i}-${b.k}" placeholder="Comentario o corrección (opcional)...">${esc(s.c)}</textarea>
        <button class="sbtn" id="sb-${i}-${b.k}" onclick="send(${i},'${b.k}')"${s.sent?' style="display:none"':''}>Enviar</button>
        <span class="sok" id="ok-${i}-${b.k}" style="display:${s.sent?'inline':'none'}">✓ Enviado</span>
      </div>
    </div>
  </div>`;
}

function build() {
  const main = document.getElementById('main');
  const g = document.getElementById('guia');
  let html = GUIA.replace(' open>', g && !g.open ? '>' : ' open>');
  let count = 0;
  DATA.forEach((p, i) => {
    if (F.modalidad !== 'all' && p.modalidad !== F.modalidad) return;
    const bloques = BLOQ.filter(b => (F.medio === 'all' || F.medio === b.tipo) && (F.estado === 'all' || ST[i][b.k].e === F.estado));
    if (!bloques.length) return;
    count++;
    const cls = p.modalidad === 'Posgrado' ? 'pos' : 'pre';
    const mini = BLOQ.map(b => `<i class="${ST[i][b.k].e==='aprobado'?'a':ST[i][b.k].e==='rechazado'?'r':''}" title="${b.medio}"></i>`).join('');
    html += `<div class="card${OPEN[i]===false?' closed':''}" id="card-${i}">
      <div class="ch ch-${cls}" onclick="tog(${i})">
        <span class="lvl-badge">${esc(p.modalidad.toUpperCase())}</span>
        <div class="prog-n">${esc(p.programa)}</div>
        <div class="ch-r"><span class="mini" id="mini-${i}">${mini}</span><span class="chev">▾</span></div>
      </div>
      <div class="cbody">${bloques.map(b => blockHTML(p, i, b)).join('')}</div>
    </div>`;
  });
  if (!count) html += '<div class="empty">No hay programas con estos filtros.</div>';
  main.innerHTML = html;
  document.getElementById('counter').textContent = count + ' programas';
  updP()
}

function tog(i) { OPEN[i] = OPEN[i] === false; document.getElementById('card-'+i).classList.toggle('closed') }

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function setE(i, k, e) {
  const s = ST[i][k];
  s.e = e;
  if (s.sent) { s.sent = false; const sb = document.getElementById('sb-'+i+'-'+k); if (sb) { sb.style.display=''; sb.disabled=false; sb.textContent='Enviar' } const ok = document.getElementById('ok-'+i+'-'+k); if (ok) ok.style.display='none' }
  document.getElementById('ba-'+i+'-'+k).className = 'rbtn rbtn-a' + (e==='aprobado'?' on':'');
  document.getElementById('br-'+i+'-'+k).className = 'rbtn rbtn-r' + (e==='rechazado'?' on':'');
}

async function send(i, k) {
  const p = DATA[i], s = ST[i][k], b = BLOQ.find(x => x.k === k);
  s.c = document.getElementById('ci-'+i+'-'+k).value.trim();
  if (s.e === 'pendiente') { alert('Selecciona Aprobar o Rechazar antes de enviar.'); return }
  if (s.e === 'rechazado' && !s.c) { alert('Cuéntanos qué cambiar en el comentario antes de rechazar.'); return }
  const sb = document.getElementById('sb-'+i+'-'+k);
  sb.disabled = true; sb.textContent = 'Enviando...';
  try {
    await fetch(SURL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        programa: p.programa, modalidad: p.modalidad, medio: b.medio,
        estado: s.e === 'aprobado' ? 'Aprobado' : 'Rechazado',
        comentario: (reviewer ? '[' + reviewer + '] ' : '') + s.c
      })
    });
    s.sent = true; s.saved = true;
    sb.style.display = 'none';
    document.getElementById('ok-'+i+'-'+k).style.display = 'inline';
    const bdg = document.getElementById('bdg-'+i+'-'+k);
    bdg.className = 'sbdg ' + (s.e==='aprobado'?'sbdg-a':'sbdg-r');
    bdg.textContent = s.e==='aprobado' ? '✓ Aprobado' : '✕ Rechazado';
    document.getElementById('mini-'+i).innerHTML = BLOQ.map(x => `<i class="${ST[i][x.k].saved && ST[i][x.k].e==='aprobado'?'a':ST[i][x.k].saved && ST[i][x.k].e==='rechazado'?'r':''}" title="${x.medio}"></i>`).join('');
    updP()
  } catch (err) {
    sb.disabled = false; sb.textContent = 'Enviar';
    alert('Error al enviar. Verifica tu conexión.')
  }
}

function updP() {
  let done = 0, total = 0;
  DATA.forEach((_, i) => BLOQ.forEach(b => { total++; if (ST[i][b.k].saved) done++ }));
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ptxt').textContent = done + ' / ' + total + ' revisados'
}

document.querySelectorAll('.fgrp').forEach(g => g.querySelectorAll('.fb').forEach(btn => btn.onclick = () => {
  g.querySelectorAll('.fb').forEach(x => x.className = 'fb');
  btn.className = 'fb ' + (btn.dataset.c || 'on');
  F[g.dataset.f] = btn.dataset.v;
  build()
}));

loadData();
</script>
